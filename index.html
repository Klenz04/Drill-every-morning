<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Microscope - Mitosis Lab</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            background-color: var(--panel-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Microscope Display Area */
        .viewport-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .lens-outer {
            width: 440px;
            height: 440px;
            border-radius: 50%;
            background: #000;
            border: 12px solid #334155;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 15px -3px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .lens-outer:active {
            cursor: grabbing;
        }

        #microscopeCanvas {
            width: 100%;
            height: 100%;
            display: block;
            transition: filter 0.1s ease;
        }

        .reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            background: 
                radial-gradient(circle, transparent 60%, rgba(0,0,0,0.4) 100%),
                linear-gradient(to right, transparent 49.5%, rgba(56, 189, 248, 0.15) 49.5%, rgba(56, 189, 248, 0.15) 50.5%, transparent 50.5%),
                linear-gradient(to bottom, transparent 49.5%, rgba(56, 189, 248, 0.15) 49.5%, rgba(56, 189, 248, 0.15) 50.5%, transparent 50.5%);
        }

        /* Controls Panel */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-card {
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: #334155;
            color: var(--text-main);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #475569;
        }

        .btn.active {
            background: var(--accent-color);
            color: #0f172a;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .slider-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        /* Quiz Panel */
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .quiz-btn {
            padding: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-main);
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            background: #334155;
        }

        .quiz-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .stat-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
        }

        .stat-val {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        #feedbackText {
            margin-top: 10px;
            font-size: 0.85rem;
            min-height: 36px;
        }

        .correct { color: var(--success); }
        .incorrect { color: var(--error); }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .lens-outer {
                width: 320px;
                height: 320px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left: Microscope Viewport -->
    <div class="viewport-section">
        <div class="lens-outer" id="lensViewport">
            <canvas id="microscopeCanvas" width="500" height="500"></canvas>
            <div class="reticle"></div>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-muted);">
            💡 Drag inside lens to move slide. Click a cell to inspect.
        </p>
    </div>

    <!-- Right: Controls & Quiz -->
    <div class="controls-panel">
        <!-- Controls Card -->
        <div class="panel-card">
            <h2>Microscope Controls</h2>
            
            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 6px;">Objective Power</label>
                <div class="btn-group">
                    <button class="btn active" onclick="setObjective(10)">10×</button>
                    <button class="btn" onclick="setObjective(40)">40×</button>
                    <button class="btn" onclick="setObjective(100)">100×</button>
                </div>
            </div>

            <div class="slider-group">
                <label>Focus Adjustment <span id="focusVal">0</span></label>
                <input type="range" id="focusSlider" min="-10" max="10" value="5" step="1" oninput="updateFocus()">
            </div>
        </div>

        <!-- Quiz Card -->
        <div class="panel-card">
            <h2>Cell Identification</h2>
            <div id="quizPrompt">
                <p style="font-size: 0.9rem; color: var(--text-muted);">Click on any cell inside the viewport to identify its stage of mitosis.</p>
            </div>

            <div class="quiz-options" id="quizOptions" style="display: none;">
                <button class="quiz-btn" onclick="checkAnswer('Interphase')">Interphase</button>
                <button class="quiz-btn" onclick="checkAnswer('Prophase')">Prophase</button>
                <button class="quiz-btn" onclick="checkAnswer('Metaphase')">Metaphase</button>
                <button class="quiz-btn" onclick="checkAnswer('Anaphase')">Anaphase</button>
                <button class="quiz-btn" onclick="checkAnswer('Telophase')">Telophase / Cytokinesis</button>
            </div>

            <div id="feedbackText"></div>

            <hr style="border-color: #334155; margin: 12px 0;">

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="scoreVal">0/0</div>
                    <div class="stat-lbl">Identified</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="accuracyVal">0%</div>
                    <div class="stat-lbl">Accuracy</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('microscopeCanvas');
    const ctx = canvas.getContext('2d');
    const lensViewport = document.getElementById('lensViewport');

    // State Variables
    let zoomLevel = 10; // 10, 40, 100
    let focusOffset = 5; // Perfect focus is at 0
    let panX = 0;
    let panY = 0;

    let isDragging = false;
    let startX = 0, startY = 0;

    let selectedCell = null;
    let totalAttempts = 0;
    let correctAnswers = 0;

    // Generated Mock Slide Cells Data
    const cells = [];
    const stages = ['Interphase', 'Prophase', 'Metaphase', 'Anaphase', 'Telophase'];

    function initSlideData() {
        // Generate pseudo-random grid of cells on the slide
        const count = 45;
        for (let i = 0; i < count; i++) {
            const stage = stages[Math.floor(Math.random() * stages.length)];
            cells.push({
                id: i,
                x: (Math.random() - 0.5) * 800,
                y: (Math.random() - 0.5) * 800,
                radius: 26,
                stage: stage,
                rotation: Math.random() * Math.PI * 2
            });
        }
    }

    // Drawing Logic
    function drawMicroscopeView() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Apply Blur Filter based on focus error
        const blurAmount = Math.abs(focusOffset) * 0.8;
        canvas.style.filter = `blur(${blurAmount}px)`;

        ctx.save();
        // Move origin to center of canvas
        ctx.translate(canvas.width / 2, canvas.height / 2);

        // Scale based on magnification lens
        const scale = (zoomLevel / 10) * 0.75;
        ctx.scale(scale, scale);
        ctx.translate(panX, panY);

        // Draw Slide Background Tissue Texture
        ctx.fillStyle = '#fce7f3';
        ctx.beginPath();
        ctx.arc(0, 0, 600, 0, Math.PI * 2);
        ctx.fill();

        // Draw Individual Cells
        cells.forEach(cell => {
            drawCell(cell);
        });

        ctx.restore();
    }

    function drawCell(cell) {
        ctx.save();
        ctx.translate(cell.x, cell.y);
        ctx.rotate(cell.rotation);

        // Cell Membrane & Cytoplasm
        ctx.fillStyle = 'rgba(244, 114, 182, 0.45)';
        ctx.strokeStyle = '#db2777';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, cell.radius, cell.radius * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Highlight ring if selected
        if (selectedCell && selectedCell.id === cell.id) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(0, 0, cell.radius + 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Chromatin / Chromosomes (Stained Purple)
        ctx.fillStyle = '#6b21a8';
        ctx.strokeStyle = '#581c87';
        ctx.lineWidth = 2;

        switch (cell.stage) {
            case 'Interphase':
                // Intact dark nucleus
                ctx.beginPath();
                ctx.arc(0, 0, cell.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                break;

            case 'Prophase':
                // Condensed, spotty nuclear material
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    let angle = (i / 5) * Math.PI * 2;
                    ctx.arc(Math.cos(angle)*6, Math.sin(angle)*6, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;

            case 'Metaphase':
                // Chromosomes aligned along equator
                ctx.beginPath();
                ctx.rect(-2, -cell.radius * 0.5, 4, cell.radius * 1.0);
                ctx.fill();
                break;

            case 'Anaphase':
                // Two distinct sets separating to poles
                ctx.beginPath();
                ctx.arc(-cell.radius * 0.35, 0, 5, 0, Math.PI * 2);
                ctx.arc(cell.radius * 0.35, 0, 5, 0, Math.PI * 2);
                ctx.fill();
                break;

            case 'Telophase':
                // Two forming nuclei & pinched membrane
                ctx.beginPath();
                ctx.arc(-cell.radius * 0.4, 0, 7, 0, Math.PI * 2);
                ctx.arc(cell.radius * 0.4, 0, 7, 0, Math.PI * 2);
                ctx.fill();
                break;
        }

        ctx.restore();
    }

    // Microscope Controls
    function setObjective(power) {
        zoomLevel = power;
        document.querySelectorAll('.btn-group .btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(power));
        });
        drawMicroscopeView();
    }

    function updateFocus() {
        focusOffset = parseInt(document.getElementById('focusSlider').value);
        document.getElementById('focusVal').innerText = focusOffset;
        drawMicroscopeView();
    }

    // Drag / Pan Logic
    lensViewport.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        startX = e.clientX;
        startY = e.clientY;

        const scale = (zoomLevel / 10) * 0.75;
        panX += dx / scale;
        panY += dy / scale;
        drawMicroscopeView();
    });

    window.addEventListener('mouseup', () => isDragging = false);

    // Cell Selection Handling
    lensViewport.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left - (canvas.width / 2);
        const clickY = e.clientY - rect.top - (canvas.height / 2);

        const scale = (zoomLevel / 10) * 0.75;
        
        // Transform click coords back to slide space
        const slideX = (clickX / scale) - panX;
        const slideY = (clickY / scale) - panY;

        // Find clicked cell
        const found = cells.find(c => {
            const dist = Math.hypot(c.x - slideX, c.y - slideY);
            return dist <= c.radius;
        });

        if (found) {
            selectedCell = found;
            openQuizPrompt();
        }
        drawMicroscopeView();
    });

    // Quiz Interaction Logic
    function openQuizPrompt() {
        document.getElementById('quizPrompt').innerHTML = `
            <p><strong>Cell #${selectedCell.id + 1} Selected</strong></p>
            <p style="font-size: 0.85rem; color: var(--text-muted);">What stage of the cell cycle is this cell in?</p>
        `;
        document.getElementById('quizOptions').style.display = 'flex';
        document.getElementById('feedbackText').innerText = '';
        
        // Enable option buttons
        document.querySelectorAll('.quiz-btn').forEach(b => b.disabled = false);
    }

    function checkAnswer(chosenStage) {
        if (!selectedCell) return;

        totalAttempts++;
        const feedback = document.getElementById('feedbackText');

        if (chosenStage === selectedCell.stage) {
            correctAnswers++;
            feedback.className = 'correct';
            feedback.innerText = `✓ Correct! This cell is in ${selectedCell.stage}.`;
        } else {
            feedback.className = 'incorrect';
            feedback.innerText = `✗ Incorrect. This cell is in ${selectedCell.stage}.`;
        }

        // Disable options until next cell selection
        document.querySelectorAll('.quiz-btn').forEach(b => b.disabled = true);
        updateScoreBoard();
    }

    function updateScoreBoard() {
        document.getElementById('scoreVal').innerText = `${correctAnswers}/${totalAttempts}`;
        const accuracy = totalAttempts > 0 ? Math.round((correctAnswers / totalAttempts) * 100) : 0;
        document.getElementById('accuracyVal').innerText = `${accuracy}%`;
    }

    // Initialize Lab
    initSlideData();
    drawMicroscopeView();
</script>

</body>
</html>
